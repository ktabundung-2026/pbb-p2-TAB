
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Operator PBB-P2 - Kecamatan Tabundung</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd 0%, #0a4b9c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }
    .login-header {
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
    }
  </style>
</head>
<body>

  <div class="login-card p-4">
    <!-- Header Logo & Judul -->
    <div class="login-header text-center p-3 mb-3 rounded">
      <i class="fa-solid fa-building-columns text-primary fs-1 mb-2"></i>
      <h5 class="fw-bold text-dark mb-0">Portal Operator PBB-P2</h5>
      <small class="text-muted">Kecamatan Tabundung</small>
    </div>

    <!-- Form Login Operator -->
    <form id="formLoginMultiDesa">
      
      <!-- Select Pilihan Desa -->
      <div class="mb-3">
        <label class="form-label text-muted fw-bold" style="font-size: 0.8rem;">
          <i class="fa-solid fa-location-dot text-danger"></i> Pilih Desa
        </label>
        <select id="loginDesa" class="form-select form-select-sm" required>
          <option value="">-- Pilih Desa --</option>
          <option value="Kecamatan">Kecamatan</option>
          <option value="Banggawatu">Banggawatu</option>
          <option value="Tarimbang">Tarimbang</option>
          <option value="Tapil">Tapil</option>
          <option value="Karita">Karita</option>
          <option value="Kukitalu">Kukitalu</option>
          <option value="Billa">Bila</option>
          <option value="Waikanabu">Waikanabu</option>
          <option value="Wudipandak">Wudipandak</option>
          <option value="Praing Kareha">Praing Kareha</option>
          <option value="Pindu Hurani">Pindu Hurani</option>
          </select>
      </div>

      <!-- Username Input -->
      <div class="mb-3">
        <label class="form-label text-muted fw-bold" style="font-size: 0.8rem;">
          <i class="fa-solid fa-user text-primary"></i> Username
        </label>
        <input type="text" id="loginUsername" class="form-control form-control-sm" placeholder="Masukkan username..." required>
      </div>

      <!-- Password Input -->
      <div class="mb-4">
        <label class="form-label text-muted fw-bold" style="font-size: 0.8rem;">
          <i class="fa-solid fa-key text-warning"></i> Password
        </label>
        <input type="password" id="loginPassword" class="form-control form-control-sm" placeholder="Masukkan password..." required>
      </div>

      <!-- Submit Button -->
      <div class="d-grid mb-3">
        <button type="submit" id="btnLogin" class="btn btn-primary btn-sm fw-bold py-2">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi
        </button>
      </div>

      <div class="text-center text-muted" style="font-size: 0.75rem;">
        &copy; 2026 Kecamatan Tabundung - aRL
      </div>
    </form>
  </div>

  <!-- Supabase Client JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://offeebouiohweqlgyccx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mZmVlYm91aW9od2VxbGd5Y2N4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMzEwOTYsImV4cCI6MjEwNjkwNzA5Nn0.IuJLePe6ZvPABvuSFVpwFjiM3TGiIH_4zah8fUvEfbw';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('formLoginMultiDesa').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      let desaPilihan = document.getElementById('loginDesa').value;
      let usernameInput = document.getElementById('loginUsername').value.trim();
      let passwordInput = document.getElementById('loginPassword').value.trim();
      let btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.innerText = 'Memverifikasi...';

      try {
        // Cek kecocokan Desa, Username, dan Password di Supabase
        const { data, error } = await supabaseClient
          .from('password_operator')
          .select('*')
          .eq('desa', desaPilihan)
          .eq('username', usernameInput)
          .eq('password', passwordInput)
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          alert(`❌ Login Gagal!\nUsername/Password salah atau tidak terdaftar di ${desaPilihan}.`);
        } else {
          // Simpan sesi login operator di SessionStorage browser
          sessionStorage.setItem('operator_desa', data.desa);
          sessionStorage.setItem('operator_username', data.username);

          alert(`✅ Login Berhasil!\nSelamat bertugas Operator ${data.desa}.`);
          
          // Alihkan ke halaman dashboard utama aplikasi
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        alert("Terjadi kesalahan sistem: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi';
      }
    });
  </script>
</body>
</html>
