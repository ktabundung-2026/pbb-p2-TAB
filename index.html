<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Operator PBB-P2 - Kecamatan Tabundung</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  
  <!-- Supabase JS & Dexie JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <script src="db.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log("SW Registered"))
          .catch(err => console.error("SW Failed", err));
      });
    }
  </script>
  
  <style>
    body {
      background: linear-gradient(135deg, #0d6efd 0%, #0a4b9c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }
    .login-header {
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
    }
  </style>
</head>
<body>

  <div class="login-card p-4">
    <!-- Header Logo & Judul -->
    <div class="login-header text-center p-3 mb-3 rounded">
      <i class="fa-solid fa-building-columns text-primary fs-1 mb-2"></i>
      <h5 class="fw-bold text-dark mb-0">Portal Operator PBB-P2</h5>
      <small class="text-muted">Kecamatan Tabundung</small>

      <!-- BADGE STATUS KONEKSI INTERNET -->
      <div class="mt-2">
        <span id="statusKoneksi" class="badge bg-secondary" style="font-size: 0.7rem;">Mengecek koneksi...</span>
      </div>
    </div>

    <!-- Form Login Operator -->
    <form id="formLoginMultiDesa">
      
      <!-- Select Pilihan Desa -->
      <div class="mb-3">
        <label class="form-label text-muted fw-bold" style="font-size: 0.8rem;">
          <i class="fa-solid fa-location-dot text-danger"></i> Pilih Desa
        </label>
        <select id="loginDesa" class="form-select form-select-sm" required>
          <option value="">-- Pilih Desa --</option>
          <option value="Kecamatan">Kecamatan</option>
          <option value="Banggawatu">Banggawatu</option>
          <option value="Tarimbang">Tarimbang</option>
          <option value="Tapil">Tapil</option>
          <option value="Karita">Karita</option>
          <option value="Kukitalu">Kukitalu</option>
          <option value="Billa">Billa</option>
          <option value="Waikanabu">Waikanabu</option>
          <option value="Wudipandak">Wudipandak</option>
          <option value="Praing Kareha">Praing Kareha</option>
          <option value="Pindu Hurani">Pindu Hurani</option>
        </select>
      </div>

      <!-- Username Input -->
      <div class="mb-3">
        <label class="form-label text-muted fw-bold" style="font-size: 0.8rem;">
          <i class="fa-solid fa-user text-primary"></i> Username
        </label>
        <input type="text" id="loginUsername" class="form-control form-control-sm" placeholder="Masukkan username..." required>
      </div>

      <!-- Password Input -->
      <div class="mb-4">
        <label class="form-label text-muted fw-bold" style="font-size: 0.8rem;">
          <i class="fa-solid fa-key text-warning"></i> Password
        </label>
        <input type="password" id="loginPassword" class="form-control form-control-sm" placeholder="Masukkan password..." required>
      </div>

      <!-- Submit Button -->
      <div class="d-grid mb-3">
        <button type="submit" id="btnLogin" class="btn btn-primary btn-sm fw-bold py-2">
          <i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi
        </button>
      </div>

      <div class="text-center text-muted" style="font-size: 0.75rem;">
        &copy; 2026 Kecamatan Tabundung - aRL
      </div>
    </form>
  </div>

  <!-- MODAL CANTIK: SELAMAT BERTUGAS OPERATOR -->
  <div class="modal fade" id="modalLoginSukses" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg" style="border-radius: 15px; overflow: hidden;">
        <div class="modal-body text-center p-4">
          
          <div class="mb-3">
            <span class="badge p-3 rounded-circle text-primary" style="font-size: 2.5rem; background-color: #e7f1ff;">
              <i class="fa-solid fa-user-check"></i>
            </span>
          </div>

          <h5 class="fw-bold text-dark mb-1">Selamat Bertugas!</h5>
          <h6 class="fw-bold text-primary mb-2" id="modalUsernameOp">-[ Username ]-</h6>
          <p class="text-muted small mb-3">
            Operator Desa <span class="fw-bold text-dark" id="modalDesaOp">-[ Desa ]-</span><br>
            <small class="badge bg-light text-secondary border mt-1" id="modalModeLogin">Mode: Online</small>
          </p>

          <div class="d-flex justify-content-center align-items-center gap-2 text-primary small">
            <div class="spinner-border spinner-border-sm" role="status"></div>
            <span>Mengarahkan ke Dashboard...</span>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const SUPABASE_URL = 'https://offeebouiohweqlgyccx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mZmVlYm91aW9od2VxbGd5Y2N4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMzEwOTYsImV4cCI6MjEwNjkwNzA5Nn0.IuJLePe6ZvPABvuSFVpwFjiM3TGiIH_4zah8fUvEfbw';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fungsi pembaruan label status koneksi
    function updateStatusKoneksi() {
      const el = document.getElementById('statusKoneksi');
      if (!el) return;
      if (navigator.onLine) {
        el.className = "badge bg-success";
        el.innerHTML = '<i class="fa-solid fa-wifi"></i> Mode Online';
      } else {
        el.className = "badge bg-warning text-dark";
        el.innerHTML = '<i class="fa-solid fa-plane-slash"></i> Mode Offline';
      }
    }

    document.addEventListener('DOMContentLoaded', async function() {
      updateStatusKoneksi();
      window.addEventListener('online', updateStatusKoneksi);
      window.addEventListener('offline', updateStatusKoneksi);

      // 1. Cek jika sudah login, langsung alihkan ke dashboard.html
      const sesi = cekSesiOperator();
      if (sesi) {
        window.location.href = 'dashboard.html';
        return;
      }

      // 2. Jika online, otomatis sync akun operator ke IndexedDB
      if (navigator.onLine) {
        await syncOperatorLokal();
      }
    });

    // Handle Form Login
    document.getElementById('formLoginMultiDesa').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      let desaPilihan = document.getElementById('loginDesa').value;
      let usernameInput = document.getElementById('loginUsername').value.trim();
      let passwordInput = document.getElementById('loginPassword').value.trim();
      let btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> Memverifikasi...';

      try {
        const hasil = await verifikasiLoginOperator(desaPilihan, usernameInput, passwordInput);

        if (hasil.success) {
          // Set teks username dan desa pada Modal Sambutan
          document.getElementById('modalUsernameOp').innerText = hasil.data.username;
          document.getElementById('modalDesaOp').innerText = hasil.data.desa;
          document.getElementById('modalModeLogin').innerText = `Akses: ${hasil.mode === 'lokal' ? 'Offline (Penyimpanan Perangkat)' : 'Online (Database Server)'}`;

          // Tampilkan Modal Bootstrap
          let modalEl = new bootstrap.Modal(document.getElementById('modalLoginSukses'));
          modalEl.show();

          // Beri jeda 1,8 detik agar pengguna melihat pesan sambutan sebelum berpindah halaman
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1800);

        } else {
          alert(hasil.message);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi';
        }
      } catch (err) {
        alert("Terjadi kesalahan: " + err.message);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk Aplikasi';
      }
    });
  </script>
</body>
</html>
