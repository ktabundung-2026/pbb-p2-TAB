<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoring Pajak PBB-P2 - Kecamatan Tabundung</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  
  <!-- Supabase JS & Dexie JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <script src="db.js"></script>

  <!-- jsPDF & AutoTable untuk Generate PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log("SW Registered"))
          .catch(err => console.error("SW Failed", err));
      });
    }
  </script>
  
  <style>
    body { background-color: #f8f9fa; font-size: 0.85rem; }
    .filter-btn { font-size: 0.70rem; padding: 4px 6px; }
    .app-header { background: #ffffff; border-radius: 10px; border-top: 4px solid #0d6efd; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); position: relative; }
    .dashboard-card { background: white; border-radius: 10px; border-left: 5px solid #0d6efd; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    .progress-dashboard { height: 12px; border-radius: 6px; }
    .table-responsive {
      max-height: 60vh;
      overflow-y: auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
    table.table-custom th {
      background-color: #f1f3f5;
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    table.table-custom td {
      font-size: 0.8rem;
      vertical-align: middle;
    }
    .btn-logout { position: absolute; top: 12px; right: 12px; font-size: 0.7rem; }
    .badge-wp-count { font-size: 0.8rem; }

    /* ========================================================= */
    /* PENYESUAIAN UKURAN HURUF DROPDOWN UNTUK TAMPILAN HP        */
    /* ========================================================= */
    @media (max-width: 576px) {
      #dropdownPilihWP, 
      #dropdownPilihWP option,
      .modal-body .form-select,
      .modal-body .form-control {
        font-size: 0.73rem !important; /* Huruf diperkecil agar nama WP mudah dibaca dan tidak terpotong */
        padding-top: 5px;
        padding-bottom: 5px;
      }
    }
  </style>
</head>
<body class="py-3">

  <div class="container" style="max-width: 750px;">
    
    <!-- INFORMASI APLIKASI DI BAGIAN ATAS -->
    <div class="app-header p-3 mb-3 text-center">
      <button class="btn btn-outline-danger btn-sm btn-logout" onclick="logoutOperator()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
      <div class="d-flex justify-content-center align-items-center gap-2 mb-1">
        <i class="fa-solid fa-building-columns text-primary fs-4"></i>
        <h4 class="mb-0 fw-bold text-primary">Monitoring Pajak PBB-P2</h4>
      </div>
      <h6 class="fw-bold text-dark mb-1" id="textNamaDesaHeader">Kecamatan Tabundung</h6>
      
      <!-- BADGE STATUS KONEKSI & ANTREAN SYNC OFFLINE -->
      <div class="d-flex justify-content-center align-items-center gap-2 mt-2">
        <span id="statusKoneksi" class="badge bg-secondary" style="font-size: 0.7rem;">Mengecek koneksi...</span>
        <span id="badgeAntrean" class="badge bg-warning text-dark d-none" style="font-size: 0.7rem;">0 Data Pending</span>
      </div>

      <!-- DROPDOWN PILIH DESA KHUSUS ADMIN KECAMATAN -->
      <div id="containerPilihDesa" class="mt-2" style="display: none;">
        <select id="selectDesaAdmin" class="form-select form-select-sm w-75 mx-auto fw-bold text-primary" onchange="onChangeDesaAdmin()">
          <option value="SEMUA">🌐 Rekap Seluruh Desa (Kecamatan)</option>
          <option value="Banggawatu">Desa Banggawatu</option>
          <option value="Tarimbang">Desa Tarimbang</option>
          <option value="Tapil">Desa Tapil</option>
          <option value="Karita">Desa Karita</option>
          <option value="Kukitalu">Desa Kukitalu</option>
          <option value="Billa">Desa Billa</option>
          <option value="Waikanabu">Desa Waikanabu</option>
          <option value="Wudipandak">Desa Wudipandak</option>
          <option value="Praing Kareha">Desa Praing Kareha</option>
          <option value="Pindu Hurani">Desa Pindu Hurani</option>
        </select>
      </div>

      <p class="text-muted mb-0 mt-2" style="font-size: 0.75rem;">
        Sistem Informasi Pemantauan Realisasi Setoran Pajak Bumi dan Bangunan Perdesaan dan Perkotaan (PBB-P2).
      </p>
    </div>

    <!-- DASHBOARD PROGRES DINAMIS -->
    <div class="dashboard-card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-bold mb-0 text-secondary">
          <i class="fa-solid fa-chart-pie"></i> Ringkasan Progres (<span id="dashLabelTahun">Semua Tahun</span>)
        </h6>
        <span class="badge bg-primary fs-6" id="dashPersen">0%</span>
      </div>
      
      <div class="progress progress-dashboard mb-3">
        <div id="dashProgressBar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
      </div>

      <!-- Ringkasan Keuangan (Rp) -->
      <div class="row text-center g-2 mb-3 pb-2 border-bottom">
        <div class="col-4 border-end">
          <span class="text-muted d-block" style="font-size
